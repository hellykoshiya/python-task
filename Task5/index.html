<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body class="bg-gray-50 text-slate-900">


    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <header class="max-w-7xl mx-auto px-6 pt-10 pb-8">

        <!-- Success / Error Banner -->
        <div id="banner" class="banner"></div>


        <h1 class="text-4xl font-bold">
            Products
        </h1>


        <p class="mt-2 text-lg text-slate-500">
            Explore our latest collection of products
        </p>


        <!-- ================================= -->
        <!-- SEARCH -->
        <!-- ================================= -->

        <input
            id="searchInput"
            type="text"
            placeholder="Search products..."
            class="mt-6 w-full md:w-1/2 px-5 py-3 rounded-lg
                   border border-gray-300 bg-white text-black
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
        >

    </header>



    <!-- ================================= -->
    <!-- CREATE PRODUCT -->
    <!-- ================================= -->

    <section class="max-w-7xl mx-auto px-6 mb-10">

        <div class="bg-white rounded-xl shadow-sm p-6">

            <h2 class="text-2xl font-bold mb-5">
                Create Product
            </h2>


            <form
                id="productForm"
                class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"
            >

                <input
                    id="title"
                    type="text"
                    placeholder="Product title"
                    required
                    class="px-4 py-3 rounded-lg border border-gray-300"
                >


                <input
                    id="category"
                    type="text"
                    placeholder="Category"
                    required
                    class="px-4 py-3 rounded-lg border border-gray-300"
                >


                <input
                    id="price"
                    type="number"
                    step="0.01"
                    placeholder="Price"
                    required
                    class="px-4 py-3 rounded-lg border border-gray-300"
                >


                <input
                    id="stock"
                    type="number"
                    placeholder="Stock"
                    required
                    class="px-4 py-3 rounded-lg border border-gray-300"
                >


                <button
                    type="submit"
                    class="md:col-span-2 lg:col-span-4
                           bg-blue-600 text-white py-3 rounded-lg
                           font-semibold hover:bg-blue-700"
                >
                    Create Product
                </button>

            </form>


            <p
                id="formMessage"
                class="mt-4"
            ></p>

        </div>

    </section>



    <!-- ================================= -->
    <!-- PRODUCTS -->
    <!-- ================================= -->

    <main class="max-w-7xl mx-auto px-6">


        <!-- LOADING SPINNER -->

        <div
            id="loading"
            class="hidden text-center py-6"
        >

            <div class="spinner"></div>

            <p class="mt-2 text-gray-500">
                Loading...
            </p>

        </div>



        <!-- PRODUCT CARDS -->

        <div
            id="products"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
        >
        </div>



        <!-- NO PRODUCTS -->

        <p
            id="noResults"
            class="hidden text-center text-gray-500 mt-10"
        >
            No products found.
        </p>

    </main>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

     <script src="script.js"></script> <!--- connect html to js  -->

</body>

</html>
